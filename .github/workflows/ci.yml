name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref. Scans are cheap but there is no
# reason to finish a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported through newest. pyproject claims >=3.10, so 3.10 has
        # to actually be exercised — claiming support you do not test is how
        # requires-python becomes a lie.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependency install step: there are no runtime dependencies. Running
      # straight from the checkout also proves the package does not quietly rely
      # on something that happens to be preinstalled on the runner image.

      - name: Test suite
        run: python tests/run_tests.py

      - name: Reference agents — detection and false positives
        # Both directions, in one script. A quieter report looks like progress,
        # so asserting against a target known to be vulnerable is the only thing
        # that catches an attack silently rotting; asserting against a target
        # known to be clean is the only thing that catches a false-positive
        # generator. Also checks determinism across two runs.
        run: python scripts/verify_reference_agents.py

      - name: CLI exit codes
        # `scan` must exit 1 when findings exist and 0 when clean, or CI cannot
        # gate on it. Exit 2 (scan broke) is checked separately below.
        run: python scripts/check_exit_codes.py

  sarif:
    name: sarif
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload to the Security tab. Scoped to this job only.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SARIF from the demo scan
        # The demo target is deliberately vulnerable, so `scan` exits 1 by
        # design. This step asserts that a well-formed document is produced, not
        # that the scan is clean.
        run: python scripts/make_demo_sarif.py results.sarif

      - name: Validate SARIF structure
        run: python scripts/validate_sarif.py results.sarif

      - name: Upload to code scanning
        # Default branch and pushes only, so a PR from a fork cannot write to
        # the Security tab.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: quillback-self-scan
