# Publish to PyPI via OIDC trusted publishing — no API token ever stored.
#
# One-time setup (account owner, ~3 minutes):
#   1. pypi.org → Account settings → Publishing → "Add a new pending publisher":
#        owner: saadcyber21   repo: quillback
#        workflow: publish.yml   environment: pypi
#   2. Repository Settings → Secrets and variables → Actions → Variables →
#      new repository variable: PYPI_PUBLISH = enabled
#   3. gh release create v0.2.0 --generate-notes   (next release)
# Until step 2 the job skips instead of failing: a release day must not put
# a red X on the Actions tab.
name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  pypi:
    if: vars.PYPI_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Verify the wheel installs and a scan is deterministic
        run: |
          python -m pip install dist/*.whl
          quillback scan --demo > /tmp/a.json
          quillback scan --demo > /tmp/b.json
          diff /tmp/a.json /tmp/b.json && echo "deterministic: same input, same findings"
      - uses: pypa/gh-action-pypi-publish@release/v1
